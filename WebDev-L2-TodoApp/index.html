<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <p class="subtitle">PLAN • ORGANIZE • COMPLETE</p>
            <h1>My To-Do List</h1>
            <p class="description">
                Keep track of your tasks and stay productive.
            </p>
        </header>


        <!-- Add Task -->

        <div class="add-task">

            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do?"
                maxlength="100"
            >

            <button id="add-task-btn">
                Add Task
            </button>

        </div>


        <!-- Task Lists -->

        <div class="task-container">

            <!-- Pending Tasks -->

            <section class="task-section">

                <div class="section-header">

                    <h2>Pending Tasks</h2>

                    <span id="pending-count">
                        0 pending
                    </span>

                </div>

                <div id="pending-list" class="task-list">

                    <p class="empty-message">
                        No pending tasks. You're all caught up! 🎉
                    </p>

                </div>

            </section>


            <!-- Completed Tasks -->

            <section class="task-section">

                <div class="section-header">

                    <h2>Completed Tasks</h2>

                    <span id="completed-count">
                        0 completed
                    </span>

                </div>

                <div id="completed-list" class="task-list">

                    <p class="empty-message">
                        No completed tasks yet.
                    </p>

                </div>

            </section>

        </div>


        <footer>
            <p>Level 2 • Task 3 • To-Do Web App</p>
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
